version: 2

sources:
  - name: airbnb
    schema: raw
    tables:
      - name: listings
        identifier: raw_listings

      - name: hosts
        identifier: raw_hosts

      - name: reviews
        identifier: raw_reviews
        config:
          loaded_at_field: date # this is the date column in the review tabke
          freshness:
            warn_after: {count: 1,period: hour} #// warn you if the oldest record is older than one hour
            #error_after: {count: 24, period: hour} #// error if the oldest record is older than 24 hours